name: Terraform EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  terraform-plan:

    runs-on: terraform-host

    defaults:
      run:
        working-directory: environments/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="dev-terraform.tfvars" -out=tfplan
      
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: environments/dev/tfplan

  terraform-apply:

    needs: terraform-plan
    runs-on: terraform-host

    environment: production   # 👈 manual approval happens here

    defaults:
      run:
        working-directory: environments/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init
      
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: environments/dev
      
      - name: Terraform Apply
        run: terraform apply tfplan -auto-approve